<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- quietcart favicon: a gold gift tag on a navy tile (brand colors) -->
  <rect width="64" height="64" rx="12" fill="#090E2F"/>

  <!-- the tag, tilted so its pointed end (with the punched hole) is at the top-left -->
  <g transform="rotate(45 32 32)">
    <path d="M10 32 L20 21 H50 a3 3 0 0 1 3 3 V40 a3 3 0 0 1 -3 3 H20 Z" fill="#D3AF37"/>
    <circle cx="21" cy="32" r="3.6" fill="#090E2F"/>
  </g>
</svg>